[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentincident-classifier"
version = "0.1.0"
description = "Reference rules-based classifier for AgentIncident records"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["agentincident>=0.1.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov"]

[tool.hatch.build.targets.wheel]
packages = ["src/agentincident_classifier"]
