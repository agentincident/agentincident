[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentincident"
version = "0.1.0"
description = "Recorder SDK for the AgentIncident incident specification"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
validation = ["jsonschema>=4.20"]
otel = ["opentelemetry-api>=1.20", "opentelemetry-sdk>=1.20"]
langchain = ["langchain-core>=0.3"]
crewai = ["crewai>=0.80"]
openai-agents = ["openai-agents>=0.1"]
dev = ["pytest>=8.0", "pytest-cov", "mypy", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["src/agentincident"]
