name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  schema:
    name: Validate Schema & Examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema
      - name: Validate schema is valid JSON Schema 2020-12
        run: |
          python -c "
          import json, jsonschema
          with open('schema/v0.1.json') as f:
              schema = json.load(f)
          jsonschema.Draft202012Validator.check_schema(schema)
          print('Schema is valid JSON Schema 2020-12')
          "
      - name: Validate all examples against schema
        run: |
          python -c "
          import json, glob, jsonschema
          with open('schema/v0.1.json') as f:
              schema = json.load(f)
          validator = jsonschema.Draft202012Validator(schema)
          for path in sorted(glob.glob('examples/*.json')):
              with open(path) as f:
                  data = json.load(f)
              errors = list(validator.iter_errors(data))
              if errors:
                  print(f'FAIL: {path}')
                  for e in errors:
                      print(f'  - {e.message}')
                  exit(1)
              print(f'OK: {path}')
          "

  python-sdk:
    name: Python SDK
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install SDK
        run: |
          cd sdk-python
          pip install -e ".[dev,validation]"
      - name: Lint
        run: |
          cd sdk-python
          ruff check src/
      - name: Type check
        run: |
          cd sdk-python
          mypy src/agentincident/ --ignore-missing-imports
      - name: Test
        run: |
          cd sdk-python
          pytest -v --cov=agentincident --cov-report=term-missing

  python-classifier:
    name: Reference Classifier
    runs-on: ubuntu-latest
    needs: python-sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          cd sdk-python && pip install -e . && cd ..
          cd classifier-reference && pip install -e ".[dev]"
      - name: Test
        run: |
          cd classifier-reference
          pytest -v

  python-cli:
    name: CLI
    runs-on: ubuntu-latest
    needs: [python-sdk, python-classifier]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          cd sdk-python && pip install -e ".[validation]" && cd ..
          cd classifier-reference && pip install -e . && cd ..
          cd cli && pip install -e ".[dev,classify]"
      - name: Test
        run: |
          cd cli
          pytest -v
      - name: Smoke test against examples
        run: |
          for f in examples/*.json; do
            echo "=== Report: $f ==="
            agentincident report "$f" | head -20
            echo "---"
          done

  typescript-sdk:
    name: TypeScript SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: |
          cd sdk-typescript
          npm install
      - name: Build
        run: |
          cd sdk-typescript
          npm run build
      - name: Test
        run: |
          cd sdk-typescript
          npm test

  cross-language-hash:
    name: Cross-language Hash Parity
    runs-on: ubuntu-latest
    needs: [python-sdk, typescript-sdk]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Python SDK
        run: |
          cd sdk-python && pip install -e .
      - name: Install TypeScript SDK
        run: |
          cd sdk-typescript && npm install && npm run build
      - name: Compare hash outputs
        run: |
          echo "Testing cross-language hash parity..."
          python -c "
          from agentincident.hash import compute_hash
          vectors = [
              ({'key': 'value'}, {'result': 'ok'}),
              ({}, {}),
              ({'a': 1, 'b': 2}, {'x': [1, 2, 3]}),
              ({'nested': {'z': 1, 'a': 2}}, {'arr': [None, True, False]}),
              ({'unicode': 'héllo wörld'}, {'emoji': 'test'}),
          ]
          for inp, out in vectors:
              print(compute_hash(inp, out))
          " > /tmp/python_hashes.txt

          node -e "
          const { computeHash } = require('./sdk-typescript/dist/hash.js');
          const vectors = [
              [{'key': 'value'}, {'result': 'ok'}],
              [{}, {}],
              [{'a': 1, 'b': 2}, {'x': [1, 2, 3]}],
              [{'nested': {'z': 1, 'a': 2}}, {'arr': [null, true, false]}],
              [{'unicode': 'héllo wörld'}, {'emoji': 'test'}],
          ];
          for (const [inp, out] of vectors) {
              console.log(computeHash(inp, out));
          }
          " > /tmp/ts_hashes.txt

          diff /tmp/python_hashes.txt /tmp/ts_hashes.txt && echo "PASS: All hashes match!" || (echo "FAIL: Hashes differ!" && exit 1)
